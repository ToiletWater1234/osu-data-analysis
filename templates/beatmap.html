<section id="beatmap-panel" class="workspace active">
        <div class="workspace-heading">
          <div><h2>谱面查询</h2></div>
          <p>检索官方谱面或本地 Songs；官网结果自动识别 mania / CTB，支持生成并复制 PP 图表格式。</p>
        </div>
        <form id="beatmap-form" class="control-card lookup-form">
          <label>歌名、谱面 ID 或 osu! 链接<input id="beatmap-query" placeholder="输入歌名、ID 或链接" /></label>
          <label>来源<select id="beatmap-source"><option value="official">官网（全部状态）</option><option value="local">本地谱面（含坟图）</option></select></label>
          <button class="primary-button" type="submit">查询谱面</button>
        </form>
        <p class="progress-status">mania 复用原版七列格式；CTB 使用八列格式（含玩家评价）。正文无填充色，保留星数难度色。CTB Mod 可多选，空选即 NM，冲突选项自动禁用。生成的是谱面收集格式，不预测成绩 PP；本地检索暂不生成官方难度行。</p>
        <div id="beatmap-results" class="beatmap-results"></div>
      </section>
